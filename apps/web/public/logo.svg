<svg width="368" height="368" viewBox="0 0 368 368" xmlns="http://www.w3.org/2000/svg">
  <!-- Back layer (light blue) -->
  <rect x="70" y="60" width="260" height="260" rx="46"
        fill="#8FC6FA" transform="rotate(8 200 190)"/>

  <!-- Middle layer (blue) -->
  <rect x="55" y="45" width="270" height="270" rx="46"
        fill="#1C86FA" transform="rotate(4 190 180)"/>

  <!-- Front layer (dark navy) -->
  <rect x="20" y="20" width="280" height="280" rx="46"
        fill="#1B2430"/>

  <!-- Document + pencil glyph, centered in front square -->
  <g transform="translate(160,160)" fill="none" stroke="#FFFFFF" stroke-width="14"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- document outline with folded corner -->
    <path d="M -55,-95 L 10,-95 L 55,-50 L 55,95 L -55,95 Z"/>
    <path d="M 10,-95 L 10,-50 L 55,-50"/>

    <!-- pencil, diagonal across the document -->
    <g transform="translate(0,10) rotate(45)">
      <rect x="-14" y="-90" width="28" height="150" rx="8" fill="#1B2430" stroke="#FFFFFF" stroke-width="10"/>
      <path d="M -14,-90 L 0,-115 L 14,-90 Z" fill="#1B2430" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
